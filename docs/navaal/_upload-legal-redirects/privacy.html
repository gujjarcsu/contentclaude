<title>Privacy Policy — Navaal AI</title>
<!-- Phase 8 Part B (2026-09-14): the privacy policy has ONE home, app.navaal.ai/privacy,
     generated from app/utils/legal.js so it cannot fall behind the code. This file is the
     fallback for a host that ignores .htaccess: a 0-second refresh plus a canonical, so
     nothing indexes this shell and nobody reads a stale copy. The .htaccess 301 is the
     real redirect; this page is what a visitor sees for a moment if that rule is missing. -->
<link rel="canonical" href="https://app.navaal.ai/privacy">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://app.navaal.ai/privacy">
