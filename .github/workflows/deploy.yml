name: Manual Deploy to Fly.io

# INFRA1 — this workflow exists to REPAIR a deploy, not to perform a routine one.
#
# A push to `main` already deploys (`ci.yml`, the `deploy` job). Running this as
# well deploys the same commit twice: on 2026-09-10 one commit shipped as v176
# and v177, 79 seconds apart, each opening its own outage window. `concurrency:
# deploy-group` serialises the two — it never stopped the second one happening.
#
# So the second one is now a no-op unless the commit is not actually live.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if this commit is already live (only to repair a broken deploy)"
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4

      # Runs AFTER the concurrency slot is acquired, so if a push-triggered
      # deploy of this same commit was queued ahead of this one, this reads the
      # state that deploy left behind rather than the state before it.
      - name: Is this commit already live?
        id: live
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # Cache-busted (L4): a cached read is not evidence.
          live=$(curl -fsS --max-time 15 "https://app.navaal.ai/api/build-info?cb=${RANDOM}${RANDOM}" | jq -r .sha || echo "")
          echo "live sha:   ${live:-<unreadable>}"
          echo "target sha: ${GITHUB_SHA}"
          # An UNREADABLE build-info must never cause a skip. The safe direction
          # is to deploy: refusing to deploy because we could not check is how a
          # broken production stays broken.
          if [ -n "$live" ] && [ "$live" = "$GITHUB_SHA" ] && [ "$FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This commit is already live. Skipping — deploying it again is the INFRA1 double-deploy. Re-run with force:true only to repair a broken deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # INFRA8 — do not ship a commit whose tests have not passed.
      #
      # This path runs NO tests of its own. Before INFRA1 that was survivable:
      # dispatching it double-deployed, but ci.yml also deployed the same commit
      # after its tests went green. Now the duplicate is skipped, so if this
      # path wins the race it becomes the ONLY deploy — and it can ship a commit
      # whose test job is still running or already red.
      #
      # Measured on the INFRA1 proof run: this workflow deployed at 15:56:46 and
      # CI's test job only confirmed the commit at 16:00:36. Four minutes of
      # shipped-but-unverified.
      #
      # Fails OPEN on an unreadable status, deliberately: this is the REPAIR
      # path, and refusing to deploy during an incident because the checks API
      # was slow is the wrong way to be wrong. A KNOWN-BAD status still refuses.
      - name: Has CI passed for this commit?
        if: steps.live.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "::warning::force:true — skipping the CI gate. Use this only to repair a broken deploy."
            exit 0
          fi
          status=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "Lint · Test · Build")] | .[0].conclusion // "unknown"' 2>/dev/null || echo "unreadable")
          echo "CI test job for ${GITHUB_SHA}: ${status}"
          case "$status" in
            success)
              echo "Tests passed for this commit." ;;
            unreadable|unknown|null|"")
              echo "::warning::Could not read the CI status for this commit. Proceeding — this is the repair path, and refusing to deploy because a status API was slow is the wrong way to be wrong." ;;
            *)
              echo "::error::CI's test job for this commit is '${status}', not success. Refusing to deploy. Re-run with force:true only if you are deliberately shipping past a red build."
              exit 1 ;;
          esac

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.live.outputs.skip != 'true'

      - name: Deploy to Fly.io
        if: steps.live.outputs.skip != 'true'
        run: flyctl deploy --remote-only --app contentclaude --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Confirm the deploy landed
        if: steps.live.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            actual=$(curl -fsS --max-time 10 "https://app.navaal.ai/api/build-info?cb=${RANDOM}${RANDOM}" | jq -r .sha || echo "")
            if [ "$actual" = "$GITHUB_SHA" ]; then
              echo "build-info reports $actual after ${i} attempt(s)"
              exit 0
            fi
            echo "attempt $i: got '${actual:-<none>}'"
            sleep 10
          done
          echo "::error::/api/build-info never reported $GITHUB_SHA — the deploy did not take effect"
          exit 1
