name: Observe tokensUsed

# C2 — prove UsageRecord.tokensUsed is non-zero in PRODUCTION, not just in a test.
# Spends API credit and consumes one generation credit on the shop you name.
# Touches nothing in Shopify.
on:
  workflow_dispatch:
    inputs:
      shop:
        description: "Dev shop domain, e.g. contentpilot-dev2.myshopify.com — NEVER a live commercial catalogue"
        type: string
        required: true

jobs:
  observe:
    name: One real generation, then read the row
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Generate and read back
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SHOP: ${{ inputs.shop }}
        run: |
          set -euo pipefail
          case "$SHOP" in
            *.myshopify.com) : ;;
            *) echo "::error::refusing '$SHOP' — expected a <store>.myshopify.com domain"; exit 1 ;;
          esac
          flyctl ssh console --app contentclaude \
            -C "node /app/scripts/tokens-observe--spends-api-credit.mjs $SHOP" | tee observed.json
          {
            echo '## tokensUsed, observed in production'
            echo ''
            echo '```json'
            cat observed.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
