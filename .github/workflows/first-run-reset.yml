name: First-run reset (one dev store)

# P2.7 proof tooling — put ONE of our own dev stores back on the first-run
# screen by nulling Shop.firstDraftSeenAt. Refuses any shop that is not a dev
# store by name pattern. Writes one column in our database; nothing in Shopify.
on:
  workflow_dispatch:
    inputs:
      shop:
        description: "Dev store domain, e.g. navaal-ttv-03.myshopify.com"
        required: true
        type: string

jobs:
  run:
    name: Null firstDraftSeenAt for one dev store
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Run
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SHOP: ${{ inputs.shop }}
        run: |
          set -euo pipefail
          flyctl ssh console --app contentclaude \
            -C "sh -c 'SHOP=${SHOP} node /app/scripts/first-run-reset--writes-one-shop.mjs'" | tee reset.json
          {
            echo '## First-run reset'
            echo ''
            echo '```json'
            cat reset.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
