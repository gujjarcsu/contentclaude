name: Support — close a request

# P7 C2 — mark one support request answered, by reference. Used first to close
# CC's own end-to-end test submission (cmu0us9zg0003tyi8967iysxi) so the
# owner's first real queue does not carry it. Writes ONE row's status; prints
# the reference and the resulting status, never a message body or an address.
on:
  workflow_dispatch:
    inputs:
      reference:
        description: "SupportRequest id to mark answered"
        required: true
        type: string

jobs:
  close:
    name: Mark answered
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Close
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl ssh console --app contentclaude \
            -C "node /app/scripts/support-close--writes-one-row.mjs ${{ inputs.reference }}" | tee close.json
          {
            echo '## Support request closed'
            echo ''
            echo '```json'
            cat close.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
