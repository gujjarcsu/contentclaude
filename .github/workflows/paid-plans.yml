name: Paid plans check

# B8 — "grandfather nobody" is a claim about production, so it gets queried.
# Read-only: counts and plan names, never a shop domain and never a charge id.
on:
  workflow_dispatch:

jobs:
  check:
    name: Count active paid subscriptions
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Query
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl ssh console --app contentclaude \
            -C "node /app/scripts/paid-plans-diag.mjs" | tee plans.json
          {
            echo '## Paid plans'
            echo ''
            echo '```json'
            cat plans.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
