app = "contentclaude"
primary_region = "syd"   # Sydney — matches Neon + Upstash region

[build]

# Apply migrations before the new release goes live (Phase 1 item 1).
#
# This was `prisma db push --skip-generate`, which diffs the live database
# against schema.prisma and applies whatever it decides, with no history and no
# reverse. `migrate deploy` applies exactly the committed migrations that are not
# yet recorded, in order, and refuses to invent anything. If it fails the release
# fails and Fly keeps serving the previous version — which is what should happen
# when a schema change cannot be applied.
#
# The 0_init baseline was marked applied on production with
# `prisma migrate resolve --applied 0_init` before this switch, so this is a
# no-op until the first real migration. Rollback: prisma/migrations/README.md.
[deploy]
  release_command = "npx prisma migrate deploy"

  # Explicit rather than inherited. With two machines always running, `rolling`
  # replaces them ONE AT A TIME and waits for each machine's health check to
  # pass before moving to the next, so one machine is always serving.
  #
  # `max_unavailable = 1` is the same number flyctl's 0.33 default rounds to at
  # two machines. It is written down so that adding a third machine later cannot
  # silently make it two-at-a-time and reopen the hole this section closes.
  strategy = "rolling"
  max_unavailable = 1

# Phase 0 item 12 — Fly sends SIGTERM and then SIGKILLs after kill_timeout,
# which defaults to 5 SECONDS. The graceful shutdown in startup.server.js drains
# BullMQ for up to 30 s, so every deploy hard-killed any bulk job that happened
# to be running, mid-product. 60 s covers that drain with room to spare.
kill_timeout = "60s"

# ── Process groups (Phase 1 item 2) ──────────────────────────────────────────
# One process used to serve the admin AND run the BullMQ worker. So a web deploy
# killed whatever bulk job was running; a long generation competed with page
# loads for the same CPU and the same database connections; and the worker could
# only ever live where the web server lived.
#
# `web` serves HTTP. `worker` runs jobs and nothing else — no HTTP server, no
# React. They are separate machines, so deploying the web app no longer touches
# a running job, and the worker can be sized for the work it actually does.
# Which process a machine is comes from FLY_PROCESS_GROUP (app/utils/processRole.server.js).
[processes]
  web = "npm run start"
  worker = "node worker.js"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  PORT = "3000"
  # PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK used to be set here. It stopped
  # `prisma migrate deploy` taking the advisory lock at all, because the lock is
  # per-connection and could not be acquired through a pgbouncer in transaction
  # mode, and the release command was dying with P1002 and aborting the deploy.
  #
  # It is gone. The datasource now declares `directUrl = env("DIRECT_URL")`
  # (prisma/schema.prisma), so migrations run over Neon's unpooled endpoint and
  # take the lock normally, which is what Prisma and Neon both document. The
  # lock is the thing that stops two migration runs racing; disabling it was a
  # workaround, not a fix, and it is not one to leave lying around now that
  # DIRECT_URL exists.

# HTTP belongs to the web group only. Without `processes` here, Fly would try to
# route traffic to the worker and its health check would fail forever.
[http_service]
  internal_port = 3000
  force_https = true
  # ── Why these three are what they are (measured 2026-09-10) ───────────────
  # This was `auto_stop_machines = "stop"` with `min_machines_running = 1`.
  # That combination means Fly keeps exactly ONE web machine running and stops
  # the rest — and during a deploy, that one machine is the one being replaced.
  # So a routine deploy left the app with no running web machine at all.
  #
  # Fly's own event log for release v176, which is what proved it:
  #
  #   05:58:19.539  81112eb  (the only RUNNING machine)  pending/launch
  #   05:58:20.442  784eed   (the "spare")               stopped/update
  #   05:58:23.468  81112eb                              started
  #
  # The spare was updated in place WHILE STOPPED and left stopped. It was never
  # a fallback; it was decoration. Requests arriving in that window queue at the
  # Fly proxy until some machine can serve them, which is why the symptom was
  # multi-second latency rather than a clean 5xx — and why app/uninstalled's p90
  # crossed Shopify's ~5 s delivery timeout on a handler that answers in ~40 ms
  # and does nothing before the 200 but an HMAC, a Redis SET NX and two queries.
  #
  # "off" plus two machines means the rolling deploy always has one machine
  # serving while the other is replaced. The price is one extra shared-cpu-1x
  # 512 MB machine, which is the cheapest thing in this file.
  #
  # `min_machines_running` is redundant while autostop is off. It stays because
  # it states the intent: if autostop is ever turned back on, two is the floor.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["web"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

# The web machines stay small; they serve pages and hand work to the queue.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web"]

# The worker is the one doing real work: model calls with up to four images
# inlined, JSON parsing, and Prisma writes for thousands of products. It gets
# more CPU and double the memory, and it is NEVER auto-stopped — a stopped
# worker is a queue nobody drains.
[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  processes = ["worker"]
  auto_stop_machines = "off"
  auto_start_machines = false
  # Somewhere to spill to rather than being OOM-killed mid-job. A bulk run holds
  # a product, its images and the model response at once, and an OOM kill takes
  # the whole run with it.
  swap_size_mb = 512

# The health check is an HTTP check, so it only applies to the process that
# serves HTTP. The worker has no port to check; its liveness is the Redis
# heartbeat that /api/health?deep=1 reads (Phase 1 item 2).
[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    port = 3000
    timeout = "5s"
    type = "http"
    processes = ["web"]
