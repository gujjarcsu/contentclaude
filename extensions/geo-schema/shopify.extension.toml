# Navaal — GEO/AEO theme app extension.
# Emits the FAQ JSON-LD (written to the `contentclaude.faq_schema` product
# metafield on publish — namespace kept for backwards compatibility with
# metafields already written to installed shops; renaming it would orphan
# them AND break this extension's Liquid accessor) onto the live storefront
# product page as an app embed, so AI answer engines (ChatGPT/Perplexity/
# Gemini/Google AI Overviews) can read the structured Q&A. Without this, the
# metafield exists but never reaches the page.
# NOTE: uid must NEVER change — it is the deployed extension's identity and
# the target of the theme-editor activation deep link.
name = "navaal-geo-schema"
type = "theme"
uid = "6470d60a-e399-bf73-6f2e-693a42909d5d1bab4ee4"
